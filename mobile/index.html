<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Holocron">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Brick Holocron</title>
<style>
:root{color-scheme:light;--bg:#f6f4ef;--card:#ffffff;--ink:#1b2028;--ink2:#4a5360;--ink3:#6b7480;--line:#dcd8cf;--soft:#efece4;--acc:#1c5fa8;--acc2:#e3edf8;--good:#1f7a43;--bad:#b3261e;--warn:#8a5a00;--hdr:52px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:none;overscroll-behavior-x:none;overflow:hidden}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:pan-y}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
a{color:var(--acc)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);max-width:100vw;overflow:hidden}
.top{flex:none;padding:8px 12px 6px;background:var(--bg);border-bottom:1px solid var(--line)}
.r1{display:flex;align-items:center;gap:8px}
.brand{font-weight:700;font-size:17px;white-space:nowrap;flex:none}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;min-width:0}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:600;color:var(--ink2);white-space:nowrap;min-width:0}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pages{flex:1;display:flex}
.pages button{flex:1;font-size:16px}
.ibtn{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px;height:40px;min-width:40px;padding:0 10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ibtn svg{width:20px;height:20px}
.r2{display:flex;gap:8px;margin-top:8px}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 36px 0 12px;background:var(--card);font-size:16px}
.search .x{position:absolute;right:4px;top:4px;height:34px;width:30px;border:0;background:none;color:var(--ink3);font-size:20px}
.r3{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.r3 .seg button{padding:6px 10px;font-size:15px}
.r3 .sp{flex:1}
.count{font-size:14px;color:var(--ink2);white-space:nowrap}
.chipbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:14px;line-height:1.25;color:var(--ink);text-align:left;max-width:100%;overflow-wrap:anywhere}
.chip.on{background:var(--acc2);border-color:var(--acc);color:#0f3c70;font-weight:600}
.chip.on::before{content:"✓ "}
.chip.x::after{content:" ×";font-weight:700}
.chip i{font-style:normal;color:var(--ink3);font-size:12px;margin-left:4px}
.body{flex:1;min-height:0;display:flex;position:relative}
.listcol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#list{padding:6px 10px 24px}
.row{display:flex;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 2px;text-align:left}
.row .th{width:56px;height:56px;flex:none;border-radius:8px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.row .th img{max-width:100%;max-height:100%;object-fit:contain}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.row small{display:block;color:var(--ink2);font-size:13px}
.row .pr{flex:none;text-align:right;font-weight:700;font-size:15px;max-width:34%}
.row .pr small{font-weight:400}
.row.sel{background:var(--acc2)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;padding:10px}
.card{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.card .ph{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:8px;overflow:hidden}
.card .ph img{max-width:100%;max-height:100%;object-fit:contain}
.card b{font-size:14px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.card small{font-size:12.5px;color:var(--ink2)}
.card .pr{font-weight:700;font-size:15px}
.card.sel{outline:3px solid var(--acc)}
.more{display:block;margin:14px auto;padding:10px 18px}
.empty{padding:30px 16px;color:var(--ink2);text-align:center}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 6px;background:var(--soft);color:var(--ink2);margin-right:4px;vertical-align:1px}
.pill.own{background:#dcefe2;color:#185c33}.pill.want{background:#f6e7c8;color:#6d4700}
/* panels (browse, detail, scan, sign-in) cover the list in portrait */
.panel{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:5;min-width:0}
.phead{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.phead h2{font-size:17px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptabs{flex:none;display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;background:var(--bg)}
.ptabs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px;font-weight:600;font-size:15px;color:var(--ink2);min-width:0}
.ptabs button.on{background:var(--acc2);border-color:var(--acc);color:#0f3c70}
.pbody{padding:12px 14px 30px}
.hero{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.hero .ph{width:42%;max-width:220px;aspect-ratio:4/3;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.hero .ph img{max-width:100%;max-height:100%;object-fit:contain}
.hero .meta{flex:1;min-width:0;font-size:14px;color:var(--ink2)}
.hero .meta b{display:block;font-size:17px;color:var(--ink);overflow-wrap:anywhere}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);margin:18px 0 6px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:15px}
dl.kv dt{color:var(--ink2)}
dl.kv dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.big span{display:block;font-size:13px;color:var(--ink2)}
.big b{font-size:22px}
.big .on{border-color:var(--acc);background:var(--acc2)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{display:block;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;text-decoration:none;color:var(--ink);font-weight:600;min-width:0}
.links a small{display:block;font-weight:400;color:var(--ink2);font-size:12.5px}
.note{font-size:13px;color:var(--ink2);margin:8px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px 4px 8px;font-size:14px;display:inline-flex;align-items:center;gap:6px;max-width:100%;text-align:left}
.tag::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--tc,#8b939e);flex:none}
.tag span{overflow-wrap:anywhere}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.fig{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px;text-align:center;font-size:12.5px;line-height:1.25;min-width:0}
.fig img{height:72px;max-width:100%;object-fit:contain;display:block;margin:0 auto 4px}
.fig.no{opacity:.6;border-style:dashed}
.fig.cur{outline:3px solid var(--acc)}
.fig b{display:block;font-weight:600;overflow-wrap:anywhere}
.rec{display:grid;grid-template-columns:1fr auto;gap:8px 10px;font-size:15px}
.rec span:nth-child(even){font-weight:600;text-align:right}
.ok{color:var(--good)}.bad{color:var(--bad)}.dim{color:var(--ink3);font-weight:400!important}
.deal{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.deal input{width:120px;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:16px;background:var(--card)}
.deal output{font-weight:700}
.alist{display:flex;flex-direction:column;gap:6px}
.alist .ai{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:14px}
.alist .ai b{display:block}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
details.grp{border-bottom:1px solid var(--line);padding:4px 0}
details.grp summary{font-weight:700;padding:10px 0;list-style:none;display:flex;justify-content:space-between}
details.grp summary::after{content:"+";color:var(--ink3)}
details.grp[open] summary::after{content:"−"}
details.grp summary::-webkit-details-marker{display:none}
.yr{display:flex;gap:8px;align-items:center}
.yr input{width:96px;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:16px;background:var(--card)}
.sortl{display:flex;flex-direction:column;gap:6px}
.sortl button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-weight:600}
.sortl button.on{background:var(--acc2);border-color:var(--acc);color:#0f3c70}
#reader{width:100%;max-width:480px;margin:0 auto;border-radius:12px;overflow:hidden;background:#000}
.ph0{color:var(--ink3);font-size:12px;padding:4px;text-align:center}
.side{display:none}
.toast{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;z-index:20;max-width:90%}
/* landscape: list on the left, the open item on the right, header in one row */
@media (orientation:landscape) and (min-width:600px){
  .top{padding:6px 12px}
  .r1{gap:8px}
  .r2{margin-top:6px}
  .r3{margin-top:6px}
  .listcol{flex:0 0 46%;max-width:46%;border-right:1px solid var(--line);position:relative}
  .side{display:flex;flex:1;min-width:0;position:relative}
  .side .panel{position:absolute}
  .side .placeholder{margin:auto;color:var(--ink3);padding:20px;text-align:center}
  .gal{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  #detail .back{display:none}
  .hero .ph{width:34%;max-width:170px}
}
@media (orientation:landscape) and (max-height:460px){.hero{margin-bottom:0}.hero .ph{width:26%;max-width:120px}.hero .meta b{font-size:15px}#detail .pbody{padding:8px 12px 24px}}
@media (orientation:landscape) and (max-height:460px){
  .brand{display:none}
  .r1,.r2{display:inline-flex}
  .top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
  .r1{flex:1 1 300px}
  .r2{flex:1 1 260px;margin-top:0}
  .r3{flex:1 1 100%;margin-top:0}
  .ibtn{height:36px}
  .search input{height:36px}
  .search .x{top:1px}
  .seg button{padding:5px 10px}
}
@media (max-width:360px){.brand{display:none}.r3 .seg button{padding:6px 8px;font-size:14px}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="r1">
      <div class="brand">Brick Holocron</div>
      <div class="seg pages" role="tablist"><button id="pg-sets" class="on" role="tab">Sets</button><button id="pg-figs" role="tab">Minifigs</button></div>
      <button class="ibtn" id="b-sign" aria-label="Sign in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg></button>
    </div>
    <div class="r2">
      <div class="search"><input id="q" type="search" placeholder="Search name or number" autocomplete="off" enterkeyhint="search"><button class="x" id="qx" aria-label="Clear search" hidden>×</button></div>
      <button class="ibtn" id="b-scan" aria-label="Scan a box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M7 9v6M10 9v6M13 9v6M16 9v6"/></svg>Scan</button>
    </div>
    <div class="r3">
      <div class="seg" id="scope"><button data-v="own" class="on">Owned</button><button data-v="want">Wanted</button><button data-v="all">All</button></div>
      <button class="ibtn" id="b-browse">Browse</button>
      <div class="seg" id="view"><button data-v="list" class="on" aria-label="List">List</button><button data-v="gal" aria-label="Gallery">Photos</button></div>
      <div class="seg" id="cond"><button data-v="n" class="on">New</button><button data-v="u">Used</button></div>
      <span class="sp"></span><span class="count" id="count"></span>
    </div>
    <div class="chipbar" id="active" hidden></div>
  </header>
  <div class="body">
    <div class="listcol">
      <div class="scroll" id="scroller"><div id="list"></div></div>
      <section class="panel" id="browse" hidden></section>
      <section class="panel" id="scan" hidden></section>
      <section class="panel" id="sign" hidden></section>
    </div>
    <div class="side" id="side"><div class="placeholder" id="ph">Tap a set or minifig to see it here.</div></div>
  </div>
</div>
<section class="panel" id="detail" hidden></section>
<script>
const ERAS=[["hr","Old Republic & High Republic","before 232 BBY"],["pt","Fall of the Jedi","32–19 BBY"],["ie","Reign of the Empire","19–5 BBY"],["reb","Age of Rebellion","5 BBY–4 ABY"],["nr","New Republic","9–11 ABY"],["fo","Rise of the First Order","34–35 ABY"],["alt","Outside the timeline","alternate & mixed"]];

["ep9","fo","Episode IX","Film","35 ABY",1,[],"The Rise of Skywalker: Palpatine returns, and the Skywalker saga ends."],
["rtg","alt","Rebuild the Galaxy","Series · alternate universe","remixed galaxy",0,[["Episodes",4]],"A remixed galaxy where heroes and villains have swapped roles."],

function setList(){const sc=S.scope.sets,f=S.f.sets,q=S.q.trim().toLowerCase(),qn=q.replace(/[^0-9a-z-]/g,"");
  return SETS.filter(s=>{
    if(sc==="own"&&!s.own)return false;if(sc==="want"&&!s.want)return false;
    if(f.sub.size&&!f.sub.has(s.sub))return false;if(f.src.size&&!f.src.has(s.src))return false;if(f.ty.size&&!f.ty.has(s.ty))return false;
    if(f.pri.size&&!(s.want&&f.pri.has(String(s.pri||4))))return false;
    if(f.stk==="y"&&s.stk!==1)return false;if(f.stk==="n"&&s.stk!==0)return false;
    if(f.figs==="y"&&!(s.figs||[]).length)return false;if(f.figs==="n"&&(s.figs||[]).length)return false;
    if(f.y0&&s.y<+f.y0)return false;if(f.y1&&s.y>+f.y1)return false;
    if(q){if(qn&&(s.n.toLowerCase().startsWith(qn)||num(s)===qn))return true;
      const hay=(s.name+" "+s.n+" "+s.sub+" "+srcTitle(s.src)+" "+(s.ship||"")+" "+setChars(s).join(" ")+" "+(s.figs||[]).map(x=>x[0]).join(" ")).toLowerCase();

  return Object.entries(FIGS).filter(([n,o])=>{
    if(sc==="own"&&!o.qo)return false;if(sc==="want"&&!o.w)return false;if(sc==="all"&&!o.qo&&!o.w&&!FIGSETS[n])return false;
    if(f.cat.size&&!f.cat.has(o.cat||"Other"))return false;if(f.aff.size&&!f.aff.has(figType(n)))return false;
    if(f.inset==="y"&&!FIGSETS[n])return false;if(f.inset==="n"&&FIGSETS[n])return false;
    if(q){if(n.toLowerCase()===q||n.toLowerCase().startsWith(q.replace(/\s/g,"")))return true;const hay=(n+" "+(o.nm||"")+" "+(o.c||"")+" "+(o.cat||"")).toLowerCase();return q.split(/\s+/).every(w=>hay.includes(w))}
    return true}).map(([n,o])=>Object.assign({n},o))}

  figs:[["name","Name",1],["num","Minifig number",1],["price","Going price",-1],["y","Year",-1],["sets","Sets it's in",-1],["char","Character",1]]};

  const f=x;return k==="name"?(f.nm||f.n).toLowerCase():k==="num"?f.n:k==="price"?figPrice(f):k==="y"?f.y:k==="sets"?(FIGSETS[f.n]||[]).length:k==="char"?(f.c||"~").toLowerCase():0}

function loadLib(){if(window.Html5Qrcode)return Promise.resolve();if(libP)return libP;
  libP=new Promise((ok,no)=>{const urls=["https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js","https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"];let i=0;
    const tryOne=()=>{if(i>=urls.length){libP=null;return no(new Error("load"))}const sc=document.createElement("script");sc.src=urls[i++];sc.onload=()=>window.Html5Qrcode?ok():tryOne();sc.onerror=tryOne;document.head.appendChild(sc)};tryOne()});return libP}
function fmts(){const F=window.Html5QrcodeSupportedFormats;return F?[F.EAN_13,F.UPC_A,F.UPC_E,F.EAN_8,F.CODE_128]:undefined}
function found(code){const c=String(code).replace(/\D/g,"").replace(/^0+/,"");const n=CODES[c];stopScan();hidePanel("scan");
  if(n){goPage("sets");S.scope.sets="all";setQ(num(BYN[n]));setPage("sets");openItem("s:"+n);toast("Found "+BYN[n].name)}
  else drawScan(`<div class="note" style="font-size:15px;color:var(--ink)">Barcode ${esc(code)} isn't on a set in your owned or wanted lists.</div>${linksHTML([["eBay","https://www.ebay.com/sch/i.html?_nkw="+encodeURIComponent(code),"search this barcode"],["Brickset","https://brickset.com/search?query="+encodeURIComponent(code),"search this barcode"]])}`)}
async function stopScan(){if(scanner){try{await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}scanner=null}}
function drawScan(msg){const el=$("#scan");el.hidden=false;
  el.innerHTML=`<div class="phead"><h2>Look up a box</h2><button class="btn" id="sc-close">Done</button></div><div class="scroll"><div class="pbody">
  ${msg||""}<h3>Scan the barcode</h3><p class="note">Point the camera at the barcode on the box (the UPC or EAN on the side or back). ${Object.keys(CODES).length} of your sets have a barcode on file.</p>
  <div class="btnrow"><button class="btn pri" id="sc-live">Use the camera</button><label class="btn" for="sc-file">Take a photo of it</label><input id="sc-file" type="file" accept="image/*" capture="environment" hidden></div>
  <div id="reader" style="margin-top:10px"></div><p class="note" id="sc-msg"></p>
  <h3>Or type the set number</h3><p class="note">It's printed on the front of every box, near the age mark.</p>
  <div class="deal"><input id="sc-num" inputmode="numeric" placeholder="75192" style="width:160px"><button class="btn pri" id="sc-go">Find</button></div></div></div>`;
  el.querySelector("#sc-close").onclick=()=>hidePanel("scan");
  const msgEl=el.querySelector("#sc-msg");
  el.querySelector("#sc-go").onclick=()=>{const v=el.querySelector("#sc-num").value.trim();if(!v)return;hidePanel("scan");goPage("sets");S.scope.sets="all";setQ(v.replace(/\s/g,""));setPage("sets");const m=cur.filter(s=>num(s)===v||s.n===v);if(m.length===1)openItem("s:"+m[0].n)};
  el.querySelector("#sc-num").onkeydown=e=>{if(e.key==="Enter")el.querySelector("#sc-go").click()};
  el.querySelector("#sc-live").onclick=async()=>{msgEl.textContent="Starting the camera…";try{await loadLib();await stopScan();
      scanner=new Html5Qrcode("reader",{formatsToSupport:fmts(),experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
      await scanner.start({facingMode:"environment"},{fps:12,qrbox:(w,h)=>({width:Math.min(w*.9,340),height:Math.min(h*.5,160)}),aspectRatio:1.333},t=>found(t),()=>{});msgEl.textContent="Hold the barcode inside the box."}
    catch(e){msgEl.textContent=String(e&&e.name==="NotAllowedError"?"The camera wasn't allowed. Check the browser's camera permission for this page, or take a photo instead.":e&&e.message==="load"?"The scanner couldn't load. Check your connection, or type the set number.":"The camera didn't start. Try taking a photo instead.")}};
  el.querySelector("#sc-file").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;msgEl.textContent="Reading the photo…";
    try{await loadLib();await stopScan();const h=new Html5Qrcode("reader",{formatsToSupport:fmts(),experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});const t=await h.scanFile(f,false);try{h.clear()}catch(e){}found(t)}
    catch(e){msgEl.textContent="No barcode found in that photo. Get closer so the bars fill the frame, or type the set number."}}}
$("#b-scan").onclick=()=>{if(!$("#scan").hidden)return hidePanel("scan");hidePanel("browse");hidePanel("sign");drawScan()};
// ---------- sign-in (Google Sheet, same passcodes as the full Brick Holocron)
async function api(o){const r=await fetch(D.script,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({},o,{passcode:PASS}))});return r.json()}
async function signIn(p,quiet){PASS=p;try{const r=await api({action:"load"});if(!r.ok)throw new Error(r.error||"no");role=r.role;status=Object.assign({},D.base,r.status||{});priv=r.priv||{};store.set("pass",p);if(!quiet)toast(role==="admin"?"Signed in. Your prices show now.":"Signed in as a guest.");render();if(detail)drawDetail();drawSign()}
  catch(e){PASS="";role="";if(!quiet){const m=$("#si-msg");if(m)m.textContent=e.message&&e.message!=="no"&&!/fetch/i.test(e.message)?e.message:"Couldn't sign in. Check the passcode and your connection."}else store.set("pass",null)}}
function drawSign(){const el=$("#sign");if(el.hidden)return;
  el.innerHTML=`<div class="phead"><h2>Sign in</h2><button class="btn" id="si-close">Done</button></div><div class="scroll"><div class="pbody">${!D.script?`<p>Sign-in turns on once your Google Sheet is connected to Brick Holocron.</p><p class="note">Until then this page shows no paid prices, purchase dates or notes, so it's safe to share.</p>`:role?`<p>${role==="admin"?"Signed in with the admin passcode. Paid prices, purchase dates and notes show on owned sets.":"Signed in as a guest. Paid prices and purchase dates stay hidden."}</p><button class="btn" id="si-out">Sign out</button>`:`<p>Use the same passcode as the full Brick Holocron.</p><div class="deal"><input id="si-p" type="password" autocomplete="current-password" style="width:200px" placeholder="Passcode"><button class="btn pri" id="si-go">Sign in</button></div><p class="note" id="si-msg"></p>`}
  <h3>On this phone</h3><p class="note">Add this page to your home screen (Share, then Add to Home Screen) to open it like an app, full screen, with no browser swipe gestures.</p></div></div>`;
  el.querySelector("#si-close").onclick=()=>hidePanel("sign");
  const go=el.querySelector("#si-go");if(go){go.onclick=()=>signIn(el.querySelector("#si-p").value.trim());el.querySelector("#si-p").onkeydown=e=>{if(e.key==="Enter")go.click()}}
  const out=el.querySelector("#si-out");if(out)out.onclick=()=>{role="";PASS="";priv={};status=Object.assign({},D.base);store.set("pass",null);render();if(detail)drawDetail();drawSign()}}
$("#b-sign").onclick=()=>{const el=$("#sign");if(!el.hidden)return hidePanel("sign");hidePanel("browse");hidePanel("scan");el.hidden=false;drawSign()};

matchMedia("(orientation:landscape) and (min-width:600px)").addEventListener("change",()=>{placeDetail();if(detail)drawDetail()});
window.addEventListener("resize",()=>placeDetail());
setPage("sets");placeDetail();
if(D.script){const p=store.get("pass",null);if(p)signIn(p,true)}
if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
window.__holo={S,render,openItem,setList,figList};
